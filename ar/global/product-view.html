<!-- Product Details Modal -->
<div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true" >
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content rounded-3 shadow p-3 px-3">
      <small class="modal-header border-0">                                
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق">
          X
        </button>
      </small>
      <div class="row px-3 py-2">
          <div class="col-md-6 px-3">
            <div class="pt-3">
              <div style="text-align: center;">
                  <!-- <i class="fas fa-oil-can"></i> -->
                  <img id="modalImage" src="" class="img-fluid rounded" alt="">
              </div>
            </div>
          </div>

          <div class="col-md-6 px-3 pt-3 mb-5">
            <div class="">
                <h1 id="modalTitle" class="product-title">العنوان</h1>
                <h4 id="modalPrice" class="product-price">150 درهم</h4>
                <span class="instock">متوفر</span>
                <br><br>
                <span id="modalDescription" class="product-description">
                    اكتشف النكهة الفريدة.
                </span>
                                
                <div id="modalTags" class="mb-3 pt-2"></div>

                <div class="pt-2" id="viewDetailsBtn"></div>
                <div class="pt-2" id="addProductBtn"></div>
            </div>
          </div>
      </div>
    </div>
  </div>
</div>
